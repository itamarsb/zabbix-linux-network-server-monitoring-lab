services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be set}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  zabbix-server:
    image: ${ZABBIX_SERVER_IMAGE:?ZABBIX_SERVER_IMAGE must be set}
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:${ZABBIX_SERVER_PORT:?ZABBIX_SERVER_PORT must be set}:10051"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - monitoring
    cap_add:
      - NET_RAW
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  zabbix-web:
    image: ${ZABBIX_WEB_IMAGE:?ZABBIX_WEB_IMAGE must be set}
    environment:
      DB_SERVER_HOST: postgres
      DB_SERVER_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: "10051"
      ZBX_SERVER_NAME: Zabbix NOC Operations Lab
      PHP_TZ: ${PHP_TZ:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${ZABBIX_WEB_HTTP_PORT:?ZABBIX_WEB_HTTP_PORT must be set}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    networks:
      - backend
      - frontend
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  monitored-web:
    image: ${MONITORED_WEB_IMAGE:?MONITORED_WEB_IMAGE must be set}
    networks:
      - monitoring
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres-data:

networks:
  backend:
    internal: true
  frontend:
  monitoring:
